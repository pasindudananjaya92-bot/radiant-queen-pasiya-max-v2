name: Radiant Queen CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install (no scripts)
        run: npm install --ignore-scripts --no-audit --no-fund || true
      - name: Syntax check api + lib
        run: |
          set -e
          fail=0
          for f in $(find api lib -name '*.js' 2>/dev/null); do
            echo "check $f"
            node --check "$f" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "Syntax check FAILED"
            exit 1
          fi
          echo "All JS syntax OK"  
