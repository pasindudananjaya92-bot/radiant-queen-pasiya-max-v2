<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>PasiyaOS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0706;--gold:#c9a227;--gold2:#e8c547;--card:#14100e;--mut:#8a7a6a;--bd:rgba(201,162,39,.28)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f2e6d0;font:14px/1.4 system-ui,sans-serif;overflow:hidden;height:100vh}
#desk{position:fixed;inset:0 0 56px 0;overflow:auto;padding:10px}
#icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icon{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer}
.icon b{display:block;font-size:11px;color:var(--gold2);margin-top:4px}
#dock{position:fixed;left:0;right:0;bottom:0;height:56px;background:#120e0c;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-around;z-index:50}
.tbtn{background:transparent;border:0;color:var(--gold2);font-size:20px;padding:8px}
.win{display:none;position:fixed;left:4%;right:4%;top:6%;bottom:64px;background:var(--card);border:1px solid var(--bd);border-radius:16px;z-index:40;flex-direction:column;overflow:hidden}
.win.on{display:flex}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);color:var(--gold2);font-weight:700}
.hd button{background:#2a1810;color:#fff;border:0;border-radius:8px;padding:6px 10px}
.bd{flex:1;overflow:auto;padding:10px}
.form input,.form textarea,.form select,input,textarea,select{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:#0d0a08;color:#f2e6d0}
.b{background:linear-gradient(180deg,#3a2a12,#2a1c0c);color:var(--gold2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:4px 2px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card{background:#100c0a;border:1px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0}
.muted{color:var(--mut);font-size:12px}
pre{white-space:pre-wrap;word-break:break-word;font-size:11px}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#2a1c0c;color:var(--gold2);padding:8px 14px;border-radius:20px;opacity:0;transition:.2s;z-index:99;border:1px solid var(--bd)}
#toast.show{opacity:1}
.cc-tabs{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--bd)}
</style>
</head>
<body>
<div id="desk"><div id="icons"></div></div>
<div id="dock">
<button type="button" class="tbtn" data-o="explorer">📁</button>
<button type="button" class="tbtn" data-o="notepad">📝</button>
<button type="button" class="tbtn" data-o="term">⌨</button>
<button type="button" class="tbtn" data-o="settings">⚙</button>
<button type="button" class="tbtn" data-o="browserpro">🌐</button>
</div>
<div id="toast"></div>

<div class="win" id="w-explorer"><div class="hd"><span>Explorer</span><button type="button" data-x="explorer">X</button></div><div class="bd"><div class="row"><input id="ex-path" value="/Documents"/><button type="button" class="b" id="ex-go">List</button></div><pre id="ex-out" class="muted">Ready</pre></div></div>
<div class="win" id="w-notepad"><div class="hd"><span>Notepad</span><button type="button" data-x="notepad">X</button></div><div class="bd"><input id="np-path" value="/Documents/Welcome.txt"/><textarea id="np-ed" rows="12"></textarea><div class="row"><button type="button" class="b" id="np-load">Load</button><button type="button" class="b" id="np-save">Save</button></div></div></div>
<div class="win" id="w-term"><div class="hd"><span>Terminal</span><button type="button" data-x="term">X</button></div><div class="bd"><pre id="tm-out" class="muted">PasiyaOS term</pre><input id="tm-in" placeholder="help | ls | cat /Documents/x"/><button type="button" class="b" id="tm-run">Run</button></div></div>
<div class="win" id="w-browserpro"><div class="hd"><span>Browser Pro</span><button type="button" data-x="browserpro">X</button></div><div class="bd"><input id="bp-url" value="https://www.make.com"/><div class="row"><button type="button" class="b" id="bp-open">Open external</button><button type="button" class="b" id="bp-fetch">Fetch text</button></div><pre id="bp-view" class="muted">Open external for full sites.</pre></div></div>
<div class="win" id="w-settings" style="bottom:64px"><div class="hd"><span>PASIYA MAX LAB</span><button type="button" data-x="settings">X</button></div>
<div class="bd" style="padding:0;display:flex;flex-direction:column">
<div class="cc-tabs" id="cc-tabs"></div>
<div id="cc-panel" style="flex:1;overflow:auto;padding:10px"></div>
<div class="row" style="padding:8px;border-top:1px solid var(--bd)">
<button type="button" class="b" id="cc-save">Save all</button>
<button type="button" class="b" id="cc-reload">Reload</button>
<button type="button" class="b" id="cc-export">Export</button>
</div>
</div></div>

<script>
(function(){
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}}catch(e){}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}

function initData(){
  try{return(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||'';}catch(e){return'';}
}

function fsApi(action,path,content,extra){
  var body={action:action,path:path||'/',content:content||'',initData:initData()};
  if(extra){for(var k in extra){body[k]=extra[k];}}
  return fetch('/api/fs',{method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData()},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return{ok:false,error:'bad json'};});})
    .catch(function(e){return{ok:false,error:String(e)};});
}

var APPS=[
  ['explorer','📁','Explorer'],['notepad','📝','Notepad'],['term','⌨','Terminal'],
  ['settings','⚙','MAX LAB'],['browserpro','🌐','Browser Pro']
];

function paintIcons(){
  var root=document.getElementById('icons');root.innerHTML='';
  APPS.forEach(function(a){
    var d=document.createElement('div');d.className='icon';
    d.innerHTML='<div style="font-size:28px">'+a[1]+'</div><b>'+a[2]+'</b>';
    d.onclick=function(){openWin(a[0]);};
    root.appendChild(d);
  });
}

function openWin(id){
  document.querySelectorAll('.win').forEach(function(w){w.classList.remove('on');});
  var w=document.getElementById('w-'+id);
  if(w){w.classList.add('on');}
  if(id==='settings'){ccLoad();}
  if(id==='explorer'){document.getElementById('ex-go').click();}
}
function closeWin(id){var w=document.getElementById('w-'+id);if(w)w.classList.remove('on');}

document.getElementById('dock').onclick=function(ev){
  var b=ev.target.closest('[data-o]');if(!b)return;openWin(b.getAttribute('data-o'));
};
document.body.addEventListener('click',function(ev){
  var x=ev.target.getAttribute('data-x');if(x)closeWin(x);
});

document.getElementById('ex-go').onclick=function(){
  var p=document.getElementById('ex-path').value||'/';
  fsApi('ls',p).then(function(j){
    document.getElementById('ex-out').textContent=j.ok?JSON.stringify(j,null,2):(j.error||'fail');
  });
};
document.getElementById('np-load').onclick=function(){
  fsApi('read',document.getElementById('np-path').value).then(function(j){
    document.getElementById('np-ed').value=j.ok?(j.content||''):(j.error||'');
  });
};
document.getElementById('np-save').onclick=function(){
  var p=document.getElementById('np-path').value;
  fsApi('write',p,document.getElementById('np-ed').value).then(function(j){toast(j.ok?'Saved':'Fail');});
};
document.getElementById('tm-run').onclick=function(){
  var cmd=(document.getElementById('tm-in').value||'').trim();
  var out=document.getElementById('tm-out');
  if(cmd==='help'){out.textContent='help | ls | cat <path>';return;}
  if(cmd==='ls'||cmd.indexOf('ls ')===0){
    var p=cmd.length>2?cmd.slice(3).trim():'/Documents';
    fsApi('ls',p||'/Documents').then(function(j){out.textContent=JSON.stringify(j,null,2);});
    return;
  }
  if(cmd.indexOf('cat ')===0){
    fsApi('read',cmd.slice(4).trim()).then(function(j){out.textContent=j.ok?(j.content||''):(j.error||'');});
    return;
  }
  out.textContent='unknown';
};

function tgOpen(url){
  try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openLink){Telegram.WebApp.openLink(url,{try_instant_view:false});return;}}catch(e){}
  window.open(url,'_blank');
}
document.getElementById('bp-open').onclick=function(){
  var u=document.getElementById('bp-url').value.trim();if(!/^https:\/\//i.test(u))u='https://'+u;tgOpen(u);
};
document.getElementById('bp-fetch').onclick=function(){
  var u=document.getElementById('bp-url').value.trim();if(!/^https:\/\//i.test(u))u='https://'+u;
  document.getElementById('bp-view').textContent='Loading...';
  fsApi('httpget','/',undefined,{url:u}).then(function(j){
    if(!j.ok){document.getElementById('bp-view').textContent=j.error||'fail';return;}
    var t=String(j.text||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    document.getElementById('bp-view').textContent=t.slice(0,8000);
  });
};

/* ---- CONTROL LAB ---- */
window.__cc={
  version:3,
  system:{hostname:'PasiyaOS',locale:'si-LK',theme:'gold',scheduler:'balanced',selfHeal:'soft',overclock:5},
  ai:{defaultModel:'auto',reasoningDepth:40,firewallLayers:3,swarmSize:3,memoryMix:'long',promptDna:'',temperature:0.7},
  security:{lockMode:'none',encProfile:'std',ghost:'off',destruct:'off',founderOnlyHeavy:true,requireInitData:true,radar:true,autoBan:true},
  network:{proxyMode:'httpget',openExternal:true,ratePosture:'smart',bookmarks:['https://vercel.com','https://supabase.com','https://www.make.com']},
  nodes:{chain:[]},
  ui:{themeEngine:'gold',hapticProfile:'light'},
  obs:{logLevel:'info'},
  triad:{botSync:true,miniAppHeartbeat:true,alertFounder:true},
  gene:{}
};

var TABS=[
  ['sys','Core Matrix'],['ai','AI Forge'],['sec','Fortress'],['net','Hydra'],
  ['nodes','Nodes'],['ui','God UI'],['obs','Observatory'],['gene','Gene'],['triad','Triad']
];

function buildTabs(){
  var el=document.getElementById('cc-tabs');el.innerHTML='';
  TABS.forEach(function(t){
    var b=document.createElement('button');b.type='button';b.className='b';b.textContent=t[1];
    b.onclick=function(){ccCollect();ccRender(t[0]);};
    el.appendChild(b);
  });
}

function ccPanel(){return document.getElementById('cc-panel');}

function ccRender(tab){
  window.__ccTab=tab||'sys';
  var c=window.__cc,p=ccPanel();
  if(tab==='sys'){
    p.innerHTML='<div class="card"><h3>Core Matrix</h3><div class="muted">Power 9 · Risk 5</div>'+
      '<label class="muted">Scheduler</label><select id="cc-sched"><option>balanced</option><option>quantum</option><option>aggressive</option><option>eco</option></select>'+
      '<label class="muted">Self-heal</label><select id="cc-heal"><option>off</option><option>soft</option><option>hard</option></select>'+
      '<label class="muted">Overclock 1-10</label><input id="cc-oc" type="range" min="1" max="10" value="'+(c.system.overclock||5)+'"/>'+
      '<label class="muted">Hostname</label><input id="cc-host" value="'+(c.system.hostname||'')+'"/></div>';
    document.getElementById('cc-sched').value=c.system.scheduler||'balanced';
    document.getElementById('cc-heal').value=c.system.selfHeal||'soft';
  } else if(tab==='ai'){
    p.innerHTML='<div class="card"><h3>AI Brain Forge</h3><div class="muted">Power 10 · Risk 7 · Keys on Vercel only</div>'+
      '<label class="muted">Router</label><select id="cc-model"><option value="auto">auto cascade</option><option value="groq">groq</option><option value="gemini">gemini</option><option value="swarm">swarm</option></select>'+
      '<label class="muted">Reasoning depth</label><input id="cc-depth" type="range" min="1" max="100" value="'+(c.ai.reasoningDepth||40)+'"/>'+
      '<label class="muted">Firewall layers</label><select id="cc-fw"><option value="1">1</option><option value="3">3</option><option value="5">5</option></select>'+
      '<label class="muted">Swarm size</label><input id="cc-swarm" type="number" min="1" max="20" value="'+(c.ai.swarmSize||3)+'"/>'+
      '<label class="muted">Prompt DNA</label><textarea id="cc-dna" rows="3">'+(c.ai.promptDna||'')+'</textarea></div>';
    document.getElementById('cc-model').value=c.ai.defaultModel||'auto';
    document.getElementById('cc-fw').value=String(c.ai.firewallLayers||3);
  } else if(tab==='sec'){
    p.innerHTML='<div class="card"><h3>Security Fortress</h3><div class="muted">DEFENSE only · no offensive hacks</div>'+
      '<label class="muted">Lock</label><select id="cc-lock"><option value="none">none</option><option value="pass">passcode</option><option value="soul">soul-lock sim</option></select>'+
      '<label class="muted">Ghost</label><select id="cc-ghost"><option value="off">off</option><option value="soft">soft</option><option value="hard">hard</option></select>'+
      '<label><input type="checkbox" id="cc-radar"/> Threat radar (bot-side bans)</label><br>'+
      '<label><input type="checkbox" id="cc-ban"/> Auto-ban abusive users</label><br>'+
      '<label><input type="checkbox" id="cc-founder"/> Founder-only heavy cmds</label></div>';
    document.getElementById('cc-lock').value=c.security.lockMode||'none';
    document.getElementById('cc-ghost').value=c.security.ghost||'off';
    document.getElementById('cc-radar').checked=!!c.security.radar;
    document.getElementById('cc-ban').checked=!!c.security.autoBan;
    document.getElementById('cc-founder').checked=!!c.security.founderOnlyHeavy;
  } else if(tab==='net'){
    p.innerHTML='<div class="card"><h3>Network Hydra</h3>'+
      '<label class="muted">Proxy</label><select id="cc-proxy"><option value="direct">direct</option><option value="httpget">httpget</option></select>'+
      '<label class="muted">Bookmarks</label><textarea id="cc-bm" rows="4">'+(c.network.bookmarks||[]).join('\\n')+'</textarea>'+
      '<button type="button" class="b" id="cc-om">Open Make</button></div>';
    document.getElementById('cc-proxy').value=c.network.proxyMode||'httpget';
    document.getElementById('cc-om').onclick=function(){tgOpen('https://www.make.com');};
  } else if(tab==='nodes'){
    var list=((c.nodes&&c.nodes.chain)||[]).map(function(n,i){return (i+1)+'. '+n.type+' '+(n.label||'');}).join('\\n')||'(empty)';
    p.innerHTML='<div class="card"><h3>Node Factory</h3><div class="muted">Mobile-safe chain (not drag canvas)</div>'+
      '<select id="cc-nt"><option value="trigger:telegram">trigger:telegram</option><option value="trigger:time">trigger:time</option><option value="action:ai">action:ai</option><option value="action:fs">action:fs</option><option value="logic:if">logic:if</option></select>'+
      '<input id="cc-nl" placeholder="label"/><div class="row"><button type="button" class="b" id="cc-na">Add</button><button type="button" class="b" id="cc-nc">Clear</button></div>'+
      '<pre id="cc-nlist">'+list+'</pre></div>';
    document.getElementById('cc-na').onclick=function(){
      c.nodes=c.nodes||{chain:[]};
      c.nodes.chain.push({type:document.getElementById('cc-nt').value,label:document.getElementById('cc-nl').value||''});
      ccRender('nodes');
    };
    document.getElementById('cc-nc').onclick=function(){c.nodes={chain:[]};ccRender('nodes');};
  } else if(tab==='ui'){
    p.innerHTML='<div class="card"><h3>God UI</h3>'+
      '<select id="cc-uit"><option value="gold">gold</option><option value="cyber">cyber</option><option value="matrix">matrix</option><option value="nasa">nasa</option></select></div>';
    document.getElementById('cc-uit').value=c.ui.themeEngine||'gold';
  } else if(tab==='obs'){
    p.innerHTML='<div class="card"><h3>Observatory</h3>'+
      '<button type="button" class="b" id="cc-snap">Snapshot</button><pre id="cc-oo" class="muted">Ready</pre></div>';
    document.getElementById('cc-snap').onclick=function(){
      var snap={ts:Date.now(),cc:c,apps:APPS.length};
      var path='/Documents/lab/snapshot-'+Date.now()+'.json';
      fsApi('mkdir','/Documents/lab').then(function(){return fsApi('write',path,JSON.stringify(snap));})
        .then(function(j){document.getElementById('cc-oo').textContent=j.ok?('OK '+path):(j.error||'fail');});
    };
  } else if(tab==='gene'){
    p.innerHTML='<div class="card"><h3>Gene Robot</h3>'+
      '<input id="cc-gq" placeholder="search query"/><div class="row">'+
      '<button type="button" class="b" id="cc-gs">Search</button>'+
      '<button type="button" class="b" id="cc-gm">Mutate</button>'+
      '<button type="button" class="b" id="cc-gsa">Save gene</button></div><pre id="cc-go" class="muted"></pre></div>';
    document.getElementById('cc-gs').onclick=function(){
      var q=document.getElementById('cc-gq').value.trim();if(!q)return;
      var url='https://duckduckgo.com/html/?q='+encodeURIComponent(q);
      document.getElementById('cc-go').textContent='Searching...';
      fsApi('httpget','/',undefined,{url:url}).then(function(j){
        if(!j.ok){document.getElementById('cc-go').textContent=j.error||'fail';return;}
        var t=String(j.text||'');var hits=[];var re=/uddg=([^&"]+)/g;var m;var n=0;
        while((m=re.exec(t))&&n<10){try{hits.push(decodeURIComponent(m[1]));n++;}catch(e){}}
        window.__geneHits=hits;document.getElementById('cc-go').textContent=hits.join('\\n')||t.replace(/<[^>]+>/g,' ').slice(0,1500);
      });
    };
    document.getElementById('cc-gm').onclick=function(){
      var pack={id:'gene-'+Date.now(),q:document.getElementById('cc-gq').value,sources:window.__geneHits||[],steps:['research','design','implement','test']};
      window.__genePack=pack;document.getElementById('cc-go').textContent=JSON.stringify(pack,null,2);
    };
    document.getElementById('cc-gsa').onclick=function(){
      var pack=window.__genePack;if(!pack){toast('Mutate first');return;}
      var path='/Documents/lab/genes/'+pack.id+'.json';
      fsApi('mkdir','/Documents/lab/genes').then(function(){return fsApi('write',path,JSON.stringify(pack));})
        .then(function(j){toast(j.ok?'Gene saved':'fail');});
    };
  } else if(tab==='triad'){
    p.innerHTML='<div class="card"><h3>Unified Triad</h3><div class="muted">Bot + Mini App + Phone session</div>'+
      '<label><input type="checkbox" id="cc-sync"/> Heartbeat sync to FS</label><br>'+
      '<label><input type="checkbox" id="cc-hb"/> Log UI actions to /Documents/lab/triad-events.jsonl</label><br>'+
      '<label><input type="checkbox" id="cc-al"/> Alert founder on security events</label>'+
      '<p class="muted">Honest scope: Mini App + bot + your FS — not full phone OS spyware.</p>'+
      '<button type="button" class="b" id="cc-ping">Write heartbeat now</button><pre id="cc-tr" class="muted"></pre></div>';
    document.getElementById('cc-sync').checked=!!c.triad.botSync;
    document.getElementById('cc-hb').checked=!!c.triad.miniAppHeartbeat;
    document.getElementById('cc-al').checked=!!c.triad.alertFounder;
    document.getElementById('cc-ping').onclick=function(){
      var ev={ts:Date.now(),type:'heartbeat',ua:(navigator.userAgent||'').slice(0,80)};
      fsApi('write','/Documents/lab/triad-heartbeat.json',JSON.stringify(ev)).then(function(j){
        document.getElementById('cc-tr').textContent=j.ok?'heartbeat OK':'fail';
      });
    };
  }
}

function ccCollect(){
  var c=window.__cc,tab=window.__ccTab||'sys';
  try{
    if(tab==='sys'){
      c.system.scheduler=(document.getElementById('cc-sched')||{}).value||c.system.scheduler;
      c.system.selfHeal=(document.getElementById('cc-heal')||{}).value||c.system.selfHeal;
      c.system.overclock=parseInt((document.getElementById('cc-oc')||{}).value,10)||c.system.overclock;
      c.system.hostname=(document.getElementById('cc-host')||{}).value||c.system.hostname;
    } else if(tab==='ai'){
      c.ai.defaultModel=(document.getElementById('cc-model')||{}).value||c.ai.defaultModel;
      c.ai.reasoningDepth=parseInt((document.getElementById('cc-depth')||{}).value,10)||c.ai.reasoningDepth;
      c.ai.firewallLayers=parseInt((document.getElementById('cc-fw')||{}).value,10)||c.ai.firewallLayers;
      c.ai.swarmSize=parseInt((document.getElementById('cc-swarm')||{}).value,10)||c.ai.swarmSize;
      c.ai.promptDna=(document.getElementById('cc-dna')||{}).value||'';
    } else if(tab==='sec'){
      c.security.lockMode=(document.getElementById('cc-lock')||{}).value||c.security.lockMode;
      c.security.ghost=(document.getElementById('cc-ghost')||{}).value||c.security.ghost;
      c.security.radar=!!(document.getElementById('cc-radar')||{}).checked;
      c.security.autoBan=!!(document.getElementById('cc-ban')||{}).checked;
      c.security.founderOnlyHeavy=!!(document.getElementById('cc-founder')||{}).checked;
    } else if(tab==='net'){
      c.network.proxyMode=(document.getElementById('cc-proxy')||{}).value||c.network.proxyMode;
      var bm=(document.getElementById('cc-bm')||{}).value||'';
      c.network.bookmarks=bm.split(/\\n/).map(function(s){return s.trim();}).filter(Boolean);
    } else if(tab==='ui'){
      c.ui.themeEngine=(document.getElementById('cc-uit')||{}).value||c.ui.themeEngine;
    } else if(tab==='triad'){
      c.triad.botSync=!!(document.getElementById('cc-sync')||{}).checked;
      c.triad.miniAppHeartbeat=!!(document.getElementById('cc-hb')||{}).checked;
      c.triad.alertFounder=!!(document.getElementById('cc-al')||{}).checked;
    }
  }catch(e){}
  return c;
}

function ccSave(){
  ccCollect();
  fsApi('write','/Documents/os-settings.json',JSON.stringify(window.__cc,null,2)).then(function(j){toast(j.ok?'Lab saved':'Save fail');});
}
function ccLoad(){
  fsApi('read','/Documents/os-settings.json').then(function(j){
    if(j.ok&&j.content){try{window.__cc=Object.assign(window.__cc,JSON.parse(j.content));}catch(e){}}
    ccRender(window.__ccTab||'sys');
  });
}
document.getElementById('cc-save').onclick=ccSave;
document.getElementById('cc-reload').onclick=ccLoad;
document.getElementById('cc-export').onclick=function(){
  ccCollect();
  fsApi('write','/Documents/os-settings-export.txt',JSON.stringify(window.__cc,null,2)).then(function(j){toast(j.ok?'Exported':'fail');});
};

paintIcons();buildTabs();ccRender('sys');
fsApi('seed','/').then(function(){toast('PasiyaOS Core Lab online');});
})();
</script>
</body>
</html>
