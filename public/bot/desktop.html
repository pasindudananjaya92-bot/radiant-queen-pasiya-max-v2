<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PasiyaOS Desktop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0706;
      --panel: #14100c;
      --panel2: #1c1510;
      --gold: #c9a227;
      --gold2: #e8c547;
      --text: #f3e6c8;
      --muted: #9a8b6e;
      --border: #3a2e1a;
      --danger: #a33;
      --ok: #3a8f5a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); }
    body {
      background: radial-gradient(ellipse 120% 80% at 50% 20%, #1a0f0a 0%, #0a0706 55%, #050304 100%);
    }
    #wallpaper {
      position: fixed; inset: 0; z-index: 0;
      background-image: radial-gradient(circle at 20% 80%, rgba(201,162,39,.08), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(139,30,30,.12), transparent 35%);
      pointer-events: none;
    }
    #taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 52px; z-index: 1000;
      background: rgba(12, 9, 7, 0.94); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
      backdrop-filter: blur(8px);
    }
    .tb-btn {
      width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--gold2); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn:active, .tb-btn.active { border-color: var(--gold); background: #2a2010; }
    .tb-title { font-size: 12px; color: var(--gold); font-weight: 700; margin-left: 4px; letter-spacing: .04em; }
    .tb-clock { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    #desktop-area {
      position: fixed; left: 0; right: 0; top: 0; bottom: 52px; z-index: 1;
      padding: 16px; overflow: hidden;
    }
    .desk-icon {
      width: 76px; text-align: center; display: inline-flex; flex-direction: column; align-items: center;
      gap: 6px; margin: 8px; cursor: pointer; user-select: none;
    }
    .desk-icon .ic {
      width: 48px; height: 48px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .desk-icon span { font-size: 11px; color: var(--text); text-shadow: 0 1px 2px #000; }
    .window {
      position: absolute; min-width: 280px; min-height: 200px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.55); display: none; flex-direction: column;
      overflow: hidden; z-index: 10;
    }
    .window.open { display: flex; }
    .window.focused { border-color: var(--gold); z-index: 20; }
    .w-title {
      height: 40px; background: linear-gradient(180deg, #221810, #18120c);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      padding: 0 10px; gap: 8px; cursor: default; user-select: none;
    }
    .w-title b { font-size: 13px; color: var(--gold2); flex: 1; }
    .w-x {
      width: 28px; height: 28px; border: none; border-radius: 8px; background: #3a1515;
      color: #f0c0c0; cursor: pointer; font-size: 14px;
    }
    .w-body { flex: 1; display: flex; min-height: 0; }
    /* Explorer */
    #win-explorer { width: min(420px, 96vw); height: min(480px, 70vh); left: 12px; top: 12px; }
    .exp-side {
      width: 120px; border-right: 1px solid var(--border); background: var(--panel2);
      padding: 8px; overflow-y: auto; font-size: 12px;
    }
    .exp-side div {
      padding: 8px 8px; border-radius: 8px; cursor: pointer; color: var(--muted);
    }
    .exp-side div:hover, .exp-side div.on { background: #2a2010; color: var(--gold2); }
    .exp-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .exp-path {
      padding: 8px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .exp-list { flex: 1; overflow-y: auto; padding: 8px; }
    .exp-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
    }
    .exp-row:hover { background: #2a2010; }
    .exp-row .meta { margin-left: auto; font-size: 11px; color: var(--muted); }
    .exp-toolbar { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); }
    .exp-toolbar button, .np-toolbar button {
      flex: 1; border: 1px solid var(--border); background: var(--panel2); color: var(--text);
      border-radius: 8px; padding: 8px; font-size: 12px; cursor: pointer;
    }
    .exp-toolbar button:active, .np-toolbar button:active { border-color: var(--gold); }
    /* Notepad */
    #win-notepad { width: min(420px, 96vw); height: min(480px, 70vh); right: 12px; top: 24px; left: auto; }
    .np-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #np-path { padding: 6px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
    #np-editor {
      flex: 1; width: 100%; border: none; resize: none; padding: 12px;
      background: #0e0b09; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; line-height: 1.45; outline: none;
    }
    .np-toolbar { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); }
    #status {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 60px; z-index: 2000;
      background: #1a120c; border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; display: none;
      max-width: 90vw; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    #status.show { display: block; }
    #auth-banner {
      position: fixed; left: 12px; right: 12px; top: 12px; z-index: 50;
      background: #1a120c; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; font-size: 13px; display: none;
    }
  </style>
</head>
<body>
  <div id="wallpaper"></div>
  <div id="auth-banner"></div>
  <div id="desktop-area">
    <div class="desk-icon" data-app="explorer"><div class="ic">📁</div><span>Explorer</span></div>
    <div class="desk-icon" data-app="notepad"><div class="ic">📝</div><span>Notepad</span></div>
    <div class="desk-icon" data-app="docs"><div class="ic">📄</div><span>Documents</span></div>
  </div>

  <!-- Explorer -->
  <div class="window" id="win-explorer">
    <div class="w-title"><b>📁 File Explorer</b><button class="w-x" data-close="explorer">✕</button></div>
    <div class="w-body">
      <div class="exp-side" id="exp-side"></div>
      <div class="exp-main">
        <div class="exp-path" id="exp-path">/</div>
        <div class="exp-list" id="exp-list"></div>
        <div class="exp-toolbar">
          <button type="button" id="btn-up">⬆ Up</button>
          <button type="button" id="btn-new-file">＋ File</button>
          <button type="button" id="btn-new-folder">＋ Folder</button>
          <button type="button" id="btn-refresh">↻</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Notepad -->
  <div class="window" id="win-notepad">
    <div class="w-title"><b>📝 Notepad</b><button class="w-x" data-close="notepad">✕</button></div>
    <div class="w-body">
      <div class="np-wrap">
        <div id="np-path">No file open</div>
        <textarea id="np-editor" placeholder="Open a file from Explorer or create one…"></textarea>
        <div class="np-toolbar">
          <button type="button" id="btn-save">💾 Save</button>
          <button type="button" id="btn-np-docs">Documents</button>
        </div>
      </div>
    </div>
  </div>

  <div id="taskbar">
    <button class="tb-btn" id="tb-start" title="Start">✦</button>
    <button class="tb-btn" data-app="explorer" title="Explorer">📁</button>
    <button class="tb-btn" data-app="notepad" title="Notepad">📝</button>
    <span class="tb-title">PASIYA OS</span>
    <span class="tb-clock" id="clock"></span>
  </div>
  <div id="status"></div>

  <script>
(function () {
  var API = (window.PASIYA_FS_API || '/api/fs');
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
  }

  var state = {
    cwd: '/',
    npPath: null,
    dirty: false,
  };

  function toast(msg) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(function () { el.classList.remove('show'); }, 2800);
  }

  function initData() {
    if (tg && tg.initData) return tg.initData;
    return '';
  }

  async function fsApi(action, path, content, extra) {
    var body = Object.assign({ action: action, path: path || '/', initData: initData() }, extra || {});
    if (content !== undefined) body.content = content;
    var res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    var j = await res.json().catch(function () { return { ok: false, error: 'bad json' }; });
    if (!j.ok && j.error) toast(j.error);
    return j;
  }

  function openWin(name) {
    var map = { explorer: 'win-explorer', notepad: 'win-notepad' };
    var id = map[name];
    if (!id) return;
    var el = document.getElementById(id);
    el.classList.add('open', 'focused');
    document.querySelectorAll('.window').forEach(function (w) {
      if (w !== el) w.classList.remove('focused');
    });
    document.querySelectorAll('.tb-btn[data-app]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-app') === name);
    });
    if (name === 'explorer') refreshList();
  }

  function closeWin(name) {
    var map = { explorer: 'win-explorer', notepad: 'win-notepad' };
    var el = document.getElementById(map[name]);
    if (el) el.classList.remove('open', 'focused');
  }

  document.querySelectorAll('[data-app]').forEach(function (el) {
    el.addEventListener('click', function () {
      var app = el.getAttribute('data-app');
      if (app === 'docs') {
        state.cwd = '/Documents';
        openWin('explorer');
        return;
      }
      openWin(app);
    });
  });
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      closeWin(btn.getAttribute('data-close'));
    });
  });

  var shortcuts = ['/', '/Desktop', '/Documents', '/Downloads', '/Pictures', '/Projects', '/.Trash'];
  var side = document.getElementById('exp-side');
  shortcuts.forEach(function (p) {
    var d = document.createElement('div');
    d.textContent = p === '/' ? 'This PC' : p.split('/').pop();
    d.onclick = function () {
      state.cwd = p;
      refreshList();
    };
    side.appendChild(d);
  });

  async function refreshList() {
    document.getElementById('exp-path').textContent = state.cwd;
    var list = document.getElementById('exp-list');
    list.innerHTML = '<div class="exp-row">Loading…</div>';
    var j = await fsApi('list', state.cwd);
    list.innerHTML = '';
    if (!j.ok) {
      list.innerHTML = '<div class="exp-row">' + (j.error || 'error') + '</div>';
      return;
    }
    if (state.cwd !== '/') {
      var up = document.createElement('div');
      up.className = 'exp-row';
      up.innerHTML = '<span>📁</span><span>..</span>';
      up.onclick = function () { goUp(); };
      list.appendChild(up);
    }
    (j.entries || []).forEach(function (e) {
      var name = e.path.split('/').filter(Boolean).pop() || e.path;
      var row = document.createElement('div');
      row.className = 'exp-row';
      row.innerHTML =
        '<span>' + (e.type === 'dir' ? '📁' : '📄') + '</span>' +
        '<span>' + name + '</span>' +
        (e.type === 'file' ? '<span class="meta">' + (e.size || 0) + 'b</span>' : '');
      row.onclick = function () {
        if (e.type === 'dir') {
          state.cwd = e.path;
          refreshList();
        } else {
          openFile(e.path);
        }
      };
      list.appendChild(row);
    });
    if (!(j.entries || []).length && state.cwd === '/') {
      list.innerHTML += '<div class="exp-row">Empty — try Documents</div>';
    }
  }

  function goUp() {
    if (state.cwd === '/') return;
    var parts = state.cwd.split('/').filter(Boolean);
    parts.pop();
    state.cwd = '/' + parts.join('/');
    if (state.cwd === '/') state.cwd = '/';
    refreshList();
  }

  document.getElementById('btn-up').onclick = goUp;
  document.getElementById('btn-refresh').onclick = refreshList;

  document.getElementById('btn-new-folder').onclick = async function () {
    var name = prompt('Folder name');
    if (!name) return;
    var p = (state.cwd === '/' ? '' : state.cwd) + '/' + name.replace(/^\/+/, '');
    var j = await fsApi('mkdir', p);
    if (j.ok) { toast('Folder created'); refreshList(); }
  };

  document.getElementById('btn-new-file').onclick = async function () {
    var name = prompt('File name', 'notes.txt');
    if (!name) return;
    var p = (state.cwd === '/' ? '' : state.cwd) + '/' + name.replace(/^\/+/, '');
    var j = await fsApi('write', p, '');
    if (j.ok) {
      toast('File created');
      refreshList();
      openFile(p);
    }
  };

  async function openFile(path) {
    var j = await fsApi('read', path);
    if (!j.ok) return;
    state.npPath = path;
    state.dirty = false;
    document.getElementById('np-path').textContent = path;
    document.getElementById('np-editor').value = j.content || '';
    openWin('notepad');
    toast('Opened ' + path);
  }

  document.getElementById('np-editor').addEventListener('input', function () {
    state.dirty = true;
  });

  document.getElementById('btn-save').onclick = async function () {
    if (!state.npPath) {
      var name = prompt('Save as path', '/Documents/untitled.txt');
      if (!name) return;
      state.npPath = name;
    }
    var text = document.getElementById('np-editor').value;
    var j = await fsApi('write', state.npPath, text);
    if (j.ok) {
      state.dirty = false;
      document.getElementById('np-path').textContent = state.npPath + ' · saved';
      toast('Saved ' + state.npPath + ' (' + j.size + 'b)');
      if (document.getElementById('win-explorer').classList.contains('open')) refreshList();
    }
  };

  document.getElementById('btn-np-docs').onclick = function () {
    state.cwd = '/Documents';
    openWin('explorer');
  };

  document.getElementById('tb-start').onclick = function () {
    openWin('explorer');
  };

  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  tick();
  setInterval(tick, 15000);

  // Boot: seed + open explorer
  (async function boot() {
    if (!initData()) {
      var b = document.getElementById('auth-banner');
      b.style.display = 'block';
      b.innerHTML = '<b>Open from Telegram</b> via /desktop for full disk access. (initData required)';
    }
    await fsApi('seed', '/');
    state.cwd = '/';
    openWin('explorer');
  })();
})();
  </script>
</body>
</html>
