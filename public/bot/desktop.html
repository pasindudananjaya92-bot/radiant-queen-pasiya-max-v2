<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>PasiyaOS Desktop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0a0706; --panel: #14100c; --panel2: #1c1510;
      --gold: #c9a227; --gold2: #e8c547; --text: #f3e6c8;
      --muted: #9a8b6e; --border: #3a2e1a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0a0706; color: var(--text); }
    body {
      background: radial-gradient(ellipse 120% 80% at 50% 20%, #1a0f0a 0%, #0a0706 55%, #050304 100%);
    }
    #desktop-icons {
      position: fixed; left: 0; right: 0; top: 0; bottom: 52px;
      padding: 16px; z-index: 2; overflow: auto;
    }
    .desk-icon {
      width: 80px; display: inline-flex; flex-direction: column; align-items: center;
      gap: 6px; margin: 8px; cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .desk-icon .ic {
      width: 52px; height: 52px; border-radius: 14px; background: var(--panel);
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 24px; pointer-events: none;
    }
    .desk-icon span { font-size: 11px; text-align: center; pointer-events: none; text-shadow: 0 1px 3px #000; }
    .desk-icon:active .ic { border-color: var(--gold); background: #2a2010; }

    .window {
      position: fixed; z-index: 50;
      min-width: 280px; min-height: 180px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0,0,0,.6);
      display: none; flex-direction: column; overflow: hidden;
    }
    .window.open { display: flex !important; }
    .window.focused { border-color: var(--gold); z-index: 60; }
    .w-title {
      height: 42px; background: linear-gradient(180deg, #221810, #18120c);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      padding: 0 10px; gap: 8px; flex-shrink: 0;
    }
    .w-title b { font-size: 13px; color: var(--gold2); flex: 1; }
    .w-x {
      width: 32px; height: 32px; border: none; border-radius: 8px;
      background: #3a1515; color: #f0c0c0; font-size: 16px; cursor: pointer;
    }
    .w-body { flex: 1; display: flex; min-height: 0; overflow: hidden; }

    #win-explorer { width: min(400px, 94vw); height: min(460px, 68vh); left: 10px; top: 10px; }
    #win-notepad { width: min(400px, 94vw); height: min(460px, 68vh); left: 20px; top: 20px; }
    #win-term { width: min(420px, 94vw); height: min(400px, 62vh); left: 16px; top: 16px; }
    #win-ide { width: min(500px, 96vw); height: min(520px, 74vh); left: 8px; top: 8px; }

    .exp-side {
      width: 110px; border-right: 1px solid var(--border); background: var(--panel2);
      padding: 8px; overflow-y: auto; font-size: 12px; flex-shrink: 0;
    }
    .exp-side div { padding: 8px; border-radius: 8px; cursor: pointer; color: var(--muted); }
    .exp-side div:active { background: #2a2010; color: var(--gold2); }
    .exp-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .exp-path { padding: 8px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
    .exp-list { flex: 1; overflow-y: auto; padding: 8px; }
    .exp-row {
      display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 8px;
      cursor: pointer; font-size: 13px;
    }
    .exp-row:active { background: #2a2010; }
    .exp-row .meta { margin-left: auto; font-size: 11px; color: var(--muted); }
    .toolbar { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .toolbar button {
      flex: 1; border: 1px solid var(--border); background: var(--panel2); color: var(--text);
      border-radius: 8px; padding: 10px 6px; font-size: 12px; cursor: pointer;
    }

    #np-path { padding: 8px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
    #np-editor {
      flex: 1; width: 100%; border: none; resize: none; padding: 12px;
      background: #0e0b09; color: var(--text); font-family: ui-monospace, Menlo, monospace;
      font-size: 13px; line-height: 1.45; outline: none;
    }

    #win-term .w-body { flex-direction: column; background: #0a0c0a; }
    #term-out {
      flex: 1; overflow-y: auto; padding: 10px 12px;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.45;
      color: #c8e6c9; white-space: pre-wrap; word-break: break-word;
    }
    #term-out .cmd { color: #e8c547; }
    #term-out .err { color: #f0a0a0; }
    #term-form {
      display: flex; align-items: center; gap: 6px; padding: 8px 10px;
      border-top: 1px solid #1e2a1e; background: #0d100d;
    }
    #term-prompt { color: #c9a227; font-family: ui-monospace, monospace; font-size: 11px; white-space: nowrap; }
    #term-input {
      flex: 1; background: transparent; border: none; outline: none; color: #e8ffe8;
      font-family: ui-monospace, monospace; font-size: 12px;
    }

    .ide-side {
      width: 130px; border-right: 1px solid var(--border); background: var(--panel2);
      display: flex; flex-direction: column; min-height: 0; flex-shrink: 0;
    }
    .ide-side-h { padding: 8px; font-size: 11px; color: var(--gold); border-bottom: 1px solid var(--border); }
    #ide-tree { flex: 1; overflow-y: auto; padding: 6px; font-size: 12px; }
    .ide-file { padding: 8px; border-radius: 6px; cursor: pointer; color: var(--muted); }
    .ide-file:active, .ide-file.on { background: #2a2010; color: var(--gold2); }
    .ide-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    #ide-tab { padding: 6px 10px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--border); }
    #ide-editor-wrap { flex: 1; min-height: 180px; position: relative; }
    #ide-fallback {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      background: #0e0b09; color: #f3e6c8; padding: 12px; font-family: monospace; font-size: 13px;
      resize: none; outline: none;
    }

    #taskbar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 52px; z-index: 100;
      background: rgba(12, 9, 7, 0.96); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
    }
    .tb-btn {
      width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--gold2); font-size: 18px; cursor: pointer;
    }
    .tb-btn:active { border-color: var(--gold); }
    .tb-title { font-size: 12px; color: var(--gold); font-weight: 700; margin-left: 4px; }
    .tb-clock { margin-left: auto; font-size: 12px; color: var(--muted); }

    #toast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; z-index: 200;
      background: #1a120c; border: 1px solid var(--border); color: var(--text);
      padding: 8px 14px; border-radius: 999px; font-size: 12px; display: none; max-width: 90vw;
    }
    #toast.show { display: block; }
    #dbg {
      position: fixed; left: 8px; right: 8px; top: 8px; z-index: 300;
      background: #300; color: #fcc; font-size: 11px; padding: 8px; border-radius: 8px;
      display: none; max-height: 80px; overflow: auto;
    }
  </style>
</head>
<body>
  <div id="dbg"></div>
  <div id="desktop-icons">
    <div class="desk-icon" id="icon-explorer"><div class="ic">📁</div><span>Explorer</span></div>
    <div class="desk-icon" id="icon-notepad"><div class="ic">📝</div><span>Notepad</span></div>
    <div class="desk-icon" id="icon-docs"><div class="ic">📄</div><span>Documents</span></div>
    <div class="desk-icon" id="icon-term"><div class="ic">⌨</div><span>Terminal</span></div>
    <div class="desk-icon" id="icon-ide"><div class="ic">💻</div><span>IDE</span></div>
  </div>

  <div class="window" id="win-explorer">
    <div class="w-title"><b>📁 File Explorer</b><button type="button" class="w-x" id="close-explorer">✕</button></div>
    <div class="w-body">
      <div class="exp-side" id="exp-side"></div>
      <div class="exp-main">
        <div class="exp-path" id="exp-path">/</div>
        <div class="exp-list" id="exp-list"></div>
        <div class="toolbar">
          <button type="button" id="btn-up">⬆ Up</button>
          <button type="button" id="btn-new-file">＋ File</button>
          <button type="button" id="btn-new-folder">＋ Folder</button>
          <button type="button" id="btn-refresh">↻</button>
        </div>
      </div>
    </div>
  </div>

  <div class="window" id="win-notepad">
    <div class="w-title"><b>📝 Notepad</b><button type="button" class="w-x" id="close-notepad">✕</button></div>
    <div class="w-body" style="flex-direction:column">
      <div id="np-path">No file open</div>
      <textarea id="np-editor" placeholder="Open a file from Explorer…"></textarea>
      <div class="toolbar">
        <button type="button" id="btn-save">💾 Save</button>
        <button type="button" id="btn-np-docs">Documents</button>
      </div>
    </div>
  </div>

  <div class="window" id="win-term">
    <div class="w-title"><b>⌨ Terminal</b><button type="button" class="w-x" id="close-term">✕</button></div>
    <div class="w-body">
      <div id="term-out"></div>
      <form id="term-form" autocomplete="off">
        <span id="term-prompt">founder@pasiyaos:/$</span>
        <input id="term-input" type="text" spellcheck="false" autocapitalize="off" />
      </form>
    </div>
  </div>

  <div class="window" id="win-ide">
    <div class="w-title"><b>💻 IDE</b><button type="button" class="w-x" id="close-ide">✕</button></div>
    <div class="w-body">
      <div class="ide-side">
        <div class="ide-side-h">/Projects</div>
        <div id="ide-tree"></div>
      </div>
      <div class="ide-main">
        <div id="ide-tab">No file open</div>
        <div id="ide-editor-wrap"><textarea id="ide-fallback" placeholder="// code"></textarea></div>
        <div class="toolbar">
          <button type="button" id="ide-save">💾 Save</button>
          <button type="button" id="ide-refresh">↻ Tree</button>
          <button type="button" id="ide-new">＋ File</button>
          <button type="button" id="ide-preview">Preview</button>
        </div>
      </div>
    </div>
  </div>

  <div id="taskbar">
    <button type="button" class="tb-btn" id="tb-explorer" title="Explorer">📁</button>
    <button type="button" class="tb-btn" id="tb-notepad" title="Notepad">📝</button>
    <button type="button" class="tb-btn" id="tb-term" title="Terminal">⌨</button>
    <button type="button" class="tb-btn" id="tb-ide" title="IDE">💻</button>
    <span class="tb-title">PASIYA OS</span>
    <span class="tb-clock" id="clock"></span>
  </div>
  <div id="toast"></div>

  <script>
(function () {
  'use strict';
  var API = '/api/fs';
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function dbg(msg) {
    var el = document.getElementById('dbg');
    el.style.display = 'block';
    el.textContent = String(msg);
  }

  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window.__t);
    window.__t = setTimeout(function () { el.classList.remove('show'); }, 2500);
  }

  function initData() {
    return (tg && tg.initData) ? tg.initData : '';
  }

  function fsApi(action, path, content, extra) {
    var body = { action: action, path: path || '/', initData: initData() };
    if (extra) {
      for (var k in extra) {
        if (Object.prototype.hasOwnProperty.call(extra, k)) body[k] = extra[k];
      }
    }
    if (content !== undefined) body.content = content;
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.text().then(function (text) {
        var j = null;
        try {
          j = text ? JSON.parse(text) : {};
        } catch (e) {
          return {
            ok: false,
            error: 'API non-JSON (HTTP ' + res.status + '): ' + String(text).slice(0, 120)
          };
        }
        if (!res.ok && j && !j.error) {
          j.ok = false;
          j.error = j.error || ('HTTP ' + res.status);
        }
        return j || { ok: false, error: 'empty response' };
      });
    }).catch(function (e) {
      return { ok: false, error: 'network: ' + String(e.message || e) };
    }).then(function (j) {
      if (j && j.error) toast(j.error);
      return j || { ok: false, error: 'empty' };
    });
  }

  /* —— Windows —— */
  function openWin(name) {
    var map = {
      explorer: 'win-explorer',
      notepad: 'win-notepad',
      term: 'win-term',
      ide: 'win-ide'
    };
    var id = map[name];
    if (!id) { toast('Unknown app: ' + name); return; }
    var el = document.getElementById(id);
    if (!el) { toast('Missing window: ' + id); return; }
    el.classList.add('open', 'focused');
    var wins = document.querySelectorAll('.window');
    for (var i = 0; i < wins.length; i++) {
      if (wins[i] !== el) wins[i].classList.remove('focused');
    }
    if (name === 'explorer') refreshList();
    if (name === 'term') {
      setTimeout(function () {
        var inp = document.getElementById('term-input');
        if (inp) inp.focus();
      }, 50);
    }
    if (name === 'ide') ideLoadTree();
    toast(name + ' open');
  }

  function closeWin(name) {
    var map = {
      explorer: 'win-explorer',
      notepad: 'win-notepad',
      term: 'win-term',
      ide: 'win-ide'
    };
    var el = document.getElementById(map[name]);
    if (el) el.classList.remove('open', 'focused');
  }

  /* —— Explorer —— */
  var cwd = '/';
  var npPath = null;

  function baseName(p) {
    var parts = String(p).split('/').filter(Boolean);
    return parts.length ? parts[parts.length - 1] : p;
  }

  function refreshList() {
    document.getElementById('exp-path').textContent = cwd;
    var list = document.getElementById('exp-list');
    list.innerHTML = '<div class="exp-row">Loading…</div>';
    fsApi('list', cwd).then(function (j) {
      list.innerHTML = '';
      if (!j.ok) {
        list.innerHTML = '<div class="exp-row">' + (j.error || 'error') + '</div>';
        return;
      }
      if (cwd !== '/') {
        var up = document.createElement('div');
        up.className = 'exp-row';
        up.textContent = '📁 ..';
        up.onclick = goUp;
        list.appendChild(up);
      }
      var entries = j.entries || [];
      for (var i = 0; i < entries.length; i++) {
        (function (e) {
          var row = document.createElement('div');
          row.className = 'exp-row';
          var label = (e.type === 'dir' ? '📁 ' : '📄 ') + baseName(e.path);
          row.innerHTML = label + (e.type === 'file' ? '<span class="meta">' + (e.size || 0) + 'b</span>' : '');
          row.onclick = function () {
            if (e.type === 'dir') {
              cwd = e.path;
              refreshList();
            } else {
              openFile(e.path);
            }
          };
          list.appendChild(row);
        })(entries[i]);
      }
      if (!entries.length) {
        list.innerHTML += '<div class="exp-row">(empty)</div>';
      }
    });
  }

  function goUp() {
    if (cwd === '/') return;
    var parts = cwd.split('/').filter(Boolean);
    parts.pop();
    cwd = parts.length ? '/' + parts.join('/') : '/';
    refreshList();
  }

  function openFile(path) {
    fsApi('read', path).then(function (j) {
      if (!j.ok) return;
      npPath = path;
      document.getElementById('np-path').textContent = path;
      document.getElementById('np-editor').value = j.content || '';
      openWin('notepad');
    });
  }

  /* —— Terminal —— */
  var termCwd = '/';

  function termPrompt() {
    document.getElementById('term-prompt').textContent = 'founder@pasiyaos:' + termCwd + '$';
  }

  function termPrint(text, cls) {
    var out = document.getElementById('term-out');
    var line = document.createElement('div');
    if (cls) line.className = cls;
    line.textContent = text;
    out.appendChild(line);
    out.scrollTop = out.scrollHeight;
  }

  function termRun(line) {
    line = String(line || '').trim();
    if (!line) return;
    termPrint('founder@pasiyaos:' + termCwd + '$ ' + line, 'cmd');
    fsApi('shell', '/', undefined, { cwd: termCwd, line: line }).then(function (j) {
      if (!j.ok) {
        termPrint(j.error || 'error', 'err');
        return;
      }
      if (j.cwd) termCwd = j.cwd;
      termPrompt();
      if (j.output === '__CLEAR__') {
        document.getElementById('term-out').innerHTML = '';
        return;
      }
      if (j.output) {
        var lines = String(j.output).split('\n');
        for (var i = 0; i < lines.length; i++) {
          termPrint(lines[i], /not found|error|missing/i.test(lines[i]) ? 'err' : '');
        }
      }
    });
  }

  /* —— IDE —— */
  var idePath = null;

  function ideLoadTree() {
    var tree = document.getElementById('ide-tree');
    tree.innerHTML = '…';
    fsApi('mkdir', '/Projects').then(function () {
      return fsApi('list', '/Projects');
    }).then(function (j) {
      tree.innerHTML = '';
      if (!j.ok) {
        tree.textContent = j.error || 'error';
        return;
      }
      var n = 0;
      (j.entries || []).forEach(function (e) {
        if (e.type !== 'file') return;
        n++;
        var row = document.createElement('div');
        row.className = 'ide-file';
        row.textContent = baseName(e.path);
        row.onclick = function () { ideOpen(e.path); };
        tree.appendChild(row);
      });
      if (!n) tree.innerHTML = '<div class="ide-file">No files yet</div>';
    });
  }

  function ideOpen(path) {
    fsApi('read', path).then(function (j) {
      if (!j.ok) return;
      idePath = path;
      document.getElementById('ide-tab').textContent = path;
      document.getElementById('ide-fallback').value = j.content || '';
      openWin('ide');
      ideLoadTree();
    });
  }

  function ideSave() {
    if (!idePath) {
      var name = prompt('File name in /Projects', 'index.html');
      if (!name) return;
      idePath = '/Projects/' + String(name).replace(/^\/+/, '');
    }
    // always absolute under /Projects
    if (idePath.charAt(0) !== '/') idePath = '/Projects/' + idePath;
    if (idePath.indexOf('/Projects/') !== 0 && idePath !== '/Projects') {
      idePath = '/Projects/' + idePath.replace(/^\/+/, '');
    }
    var val = document.getElementById('ide-fallback').value;
    toast('Saving ' + idePath + '…');
    fsApi('write', idePath, val).then(function (j) {
      if (j && j.ok) {
        document.getElementById('ide-tab').textContent = idePath + ' · saved (' + (j.size || 0) + 'b)';
        toast('Saved ' + idePath + ' (' + (j.size || 0) + 'b)');
        ideLoadTree();
      } else {
        toast('Save failed: ' + ((j && j.error) || 'unknown'));
      }
    });
  }

  /* —— Bind UI (explicit IDs — reliable on mobile) —— */
  function bind() {
    document.getElementById('icon-explorer').onclick = function () { openWin('explorer'); };
    document.getElementById('icon-notepad').onclick = function () { openWin('notepad'); };
    document.getElementById('icon-docs').onclick = function () {
      cwd = '/Documents';
      openWin('explorer');
    };
    document.getElementById('icon-term').onclick = function () { openWin('term'); };
    document.getElementById('icon-ide').onclick = function () { openWin('ide'); };

    document.getElementById('tb-explorer').onclick = function () { openWin('explorer'); };
    document.getElementById('tb-notepad').onclick = function () { openWin('notepad'); };
    document.getElementById('tb-term').onclick = function () { openWin('term'); };
    document.getElementById('tb-ide').onclick = function () { openWin('ide'); };

    document.getElementById('close-explorer').onclick = function () { closeWin('explorer'); };
    document.getElementById('close-notepad').onclick = function () { closeWin('notepad'); };
    document.getElementById('close-term').onclick = function () { closeWin('term'); };
    document.getElementById('close-ide').onclick = function () { closeWin('ide'); };

    document.getElementById('btn-up').onclick = goUp;
    document.getElementById('btn-refresh').onclick = refreshList;
    document.getElementById('btn-new-folder').onclick = function () {
      var name = prompt('Folder name');
      if (!name) return;
      var p = (cwd === '/' ? '' : cwd) + '/' + name.replace(/^\/+/g, '');
      fsApi('mkdir', p).then(function (j) { if (j.ok) refreshList(); });
    };
    document.getElementById('btn-new-file').onclick = function () {
      var name = prompt('File name', 'notes.txt');
      if (!name) return;
      var p = (cwd === '/' ? '' : cwd) + '/' + name.replace(/^\/+/g, '');
      fsApi('write', p, '').then(function (j) { if (j.ok) { refreshList(); openFile(p); } });
    };
    document.getElementById('btn-save').onclick = function () {
      if (!npPath) {
        var name = prompt('Save as', '/Documents/untitled.txt');
        if (!name) return;
        npPath = name;
      }
      var text = document.getElementById('np-editor').value;
      fsApi('write', npPath, text).then(function (j) {
        if (j.ok) toast('Saved ' + npPath + ' (' + j.size + 'b)');
      });
    };
    document.getElementById('btn-np-docs').onclick = function () {
      cwd = '/Documents';
      openWin('explorer');
    };

    document.getElementById('term-form').onsubmit = function (e) {
      e.preventDefault();
      var input = document.getElementById('term-input');
      var v = input.value;
      input.value = '';
      termRun(v);
    };

    document.getElementById('ide-save').onclick = ideSave;
    document.getElementById('ide-refresh').onclick = ideLoadTree;
    document.getElementById('ide-new').onclick = function () {
      var name = prompt('New file in /Projects', 'app.js');
      if (!name) return;
      var p = '/Projects/' + name.replace(/^\/+/g, '');
      fsApi('write', p, '').then(function (j) { if (j.ok) ideOpen(p); });
    };
    document.getElementById('ide-preview').onclick = function () {
      if (!idePath || !/\.html?$/i.test(idePath)) {
        toast('Open an .html file first');
        return;
      }
      var html = document.getElementById('ide-fallback').value;
      var w = window.open('', '_blank');
      if (w) { w.document.write(html); w.document.close(); }
    };

    var shortcuts = ['/', '/Desktop', '/Documents', '/Downloads', '/Pictures', '/Projects', '/.Trash'];
    var side = document.getElementById('exp-side');
    side.innerHTML = '';
    for (var i = 0; i < shortcuts.length; i++) {
      (function (p) {
        var d = document.createElement('div');
        d.textContent = p === '/' ? 'This PC' : baseName(p);
        d.onclick = function () { cwd = p; refreshList(); };
        side.appendChild(d);
      })(shortcuts[i]);
    }
  }

  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  try {
    bind();
    termPrompt();
    termPrint('PasiyaOS Terminal — type help', '');
    tick();
    setInterval(tick, 15000);
    fsApi('seed', '/').then(function () {
      toast('Desktop ready — tap an icon');
    });
  } catch (e) {
    dbg('JS error: ' + (e.message || e));
  }
})();
  </script>
</body>
</html>
