<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radiant Queen · Marketplace</title>
  <style>
    body { margin:0; font-family: system-ui,sans-serif; background:#0d0d0f; color:#f2f2f2; }
    header { padding:16px 20px; border-bottom:1px solid #2a2a30; }
    header span { color:#c9a227; font-weight:700; }
    main { padding:20px; max-width:720px; margin:0 auto; }
    .card { background:#16161a; border:1px solid #2a2a30; border-radius:12px; padding:16px; margin-bottom:12px; }
    code { background:#1c1c22; padding:2px 6px; border-radius:4px; }
  </style>
</head>
<body>
  <header><span>Radiant Queen</span> · Template Marketplace</header>
  <main>
    <div class="card">
      <h2>Install from Telegram</h2>
      <p><code>/market browse</code></p>
      <p><code>/market install &lt;id&gt;</code></p>
      <p>Publish (founder V1): <code>/market publish Name | description | payload</code></p>
    </div>
    <div class="card">
      <p>1-Click install tracking is stored per user. Referral bonuses can plug into Radiant Gold later.</p>
    </div>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/bot/miniapp-bridge.js"></script>
</body>
</html>
