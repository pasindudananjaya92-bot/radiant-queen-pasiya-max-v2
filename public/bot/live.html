<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radiant Queen · Live Board</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #3b0a2a, #0b0b12 55%);
      color: #f5f5f7;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; letter-spacing: 0.04em; }
    .sub { color: #a1a1aa; font-size: 0.9rem; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 14px;
    }
    .card b { display: block; font-size: 1.4rem; margin-top: 6px; }
    .card span { color: #a1a1aa; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .pulse {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; margin-right: 8px; box-shadow: 0 0 12px #22c55e;
      animation: p 1.2s infinite;
    }
    @keyframes p { 50% { opacity: 0.35; } }
    .bar {
      margin-top: 18px; padding: 12px 14px;
      background: rgba(0,0,0,0.35); border-radius: 12px;
      font-size: 0.85rem; color: #d4d4d8;
    }
    a { color: #f9a8d4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span class="pulse"></span>RADIANT QUEEN LIVE</h1>
    <p class="sub">Auto-refresh every 4s · Pack D</p>
    <div class="grid" id="grid">
      <div class="card"><span>Loading</span><b>…</b></div>
    </div>
    <div class="bar" id="meta">Connecting…</div>
    <p class="sub" style="margin-top:16px">
      Telegram: <a href="https://t.me/PasiyaMaxQueen_bot">@PasiyaMaxQueen_bot</a> · /live
    </p>
  </div>
  <script>
    const grid = document.getElementById('grid');
    const meta = document.getElementById('meta');
    const keys = [
      ['wallets', 'Wallets'],
      ['premium', 'Premium'],
      ['gold_sum', 'Gold total'],
      ['active_reminders', 'Reminders'],
      ['referrals', 'Referrals'],
      ['memory_rows', 'AI memory'],
      ['events_24h', 'Events 24h'],
      ['vault_files', 'Vault files'],
      ['email_subs', 'Email subs'],
    ];
    async function tick() {
      try {
        const r = await fetch('/api/live-board?t=' + Date.now(), { cache: 'no-store' });
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || 'fail');
        const s = j.stats || {};
        grid.innerHTML = keys.map(([k, label]) =>
          '<div class="card"><span>' + label + '</span><b>' + (s[k] ?? '—') + '</b></div>'
        ).join('');
        meta.textContent = 'Updated: ' + (j.updated_at || 'now') + ' · HTTP OK';
      } catch (e) {
        meta.textContent = 'Error: ' + (e.message || e);
      }
    }
    tick();
    setInterval(tick, 4000);
  </script>
</body>
</html>
